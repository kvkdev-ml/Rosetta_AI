<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CodeMorph - AI Code Conversion</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#00285d",
                        "on-primary": "#002e6a",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-bright": "#31394d",
                        "secondary-container": "#00a572",
                        "on-primary-fixed": "#001a42",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-tint": "#adc6ff",
                        "outline": "#8c909f",
                        "on-secondary-container": "#00311f",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#171f33",
                        "tertiary": "#ffb95f",
                        "outline-variant": "#424754",
                        "surface-container-lowest": "#060e20",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container-low": "#131b2e",
                        "on-error": "#690005",
                        "secondary": "#4edea3",
                        "error-container": "#93000a",
                        "inverse-primary": "#005ac2",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary-container": "#ca8100",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container-high": "#222a3d",
                        "inverse-surface": "#dae2fd",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#dae2fd",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed": "#002113",
                        "on-primary-fixed-variant": "#004395",
                        "on-tertiary": "#472a00",
                        "background": "#0b1326",
                        "on-surface-variant": "#c2c6d6",
                        "primary": "#adc6ff",
                        "surface-dim": "#0b1326",
                        "surface": "#0b1326",
                        "on-tertiary-fixed": "#2a1700",
                        "error": "#ffb4ab",
                        "on-surface": "#dae2fd",
                        "tertiary-fixed-dim": "#ffb95f",
                        "secondary-fixed": "#6ffbbe",
                        "surface-variant": "#2d3449",
                        "surface-container-highest": "#2d3449",
                        "on-tertiary-container": "#3e2400",
                        "on-secondary": "#003824",
                        "primary-container": "#4d8eff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px",
                        "gutter": "20px",
                        "container-max": "1440px",
                        "lg": "24px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "code-block": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "code-label": ["JetBrains Mono"],
                        "headline-md": ["Inter"],

                        "headline-lg": ["Inter"]

                    "fontSize": {
                        "code-block": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

    </script>
    <style>
        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #ddd;
            border-top: 4px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2d3449;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #424754;
        }

        .editor-textarea {
            resize: none;
            outline: none;
            background: transparent;
            color: #dae2fd;
        }

        .editor-textarea::placeholder {
            color: #424754;
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
    <!-- TopNavBar -->
    <header
        class="bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant docked full-width top-0 z-50">
        <div class="flex justify-between items-center w-full px-md md:px-lg h-16 max-w-container-max mx-auto">
            <div class="flex items-center gap-xs">
                <span class="material-symbols-outlined text-primary text-2xl"
                    style="font-variation-settings: 'FILL' 1;">code_blocks</span>
                <div class="flex flex-col">
                    <span
                        class="text-headline-md font-headline-md font-bold text-primary dark:text-primary">CodeMorph</span>
                    <span class="text-label-sm font-label-sm text-on-surface-variant">AI-Powered Conversion</span>
                </div>
            </div>
            <div class="flex items-center gap-sm">
                <button
                    class="text-on-surface-variant hover:text-primary transition-colors duration-200 p-2 rounded-full hover:bg-surface-variant/50 flex items-center justify-center">
                    <a href="https://kvk-profile-nu.vercel.app" target="_blank">About Developer</a>
                </button>
                <button
                    class="text-on-surface-variant hover:text-primary transition-colors duration-200 p-2 rounded-full hover:bg-surface-variant/50 flex items-center justify-center">
                    <a href="https://github.com/kvkdev-ml" target="_blank">KVK Github</a>
                </button>
                <button
                    class="text-on-surface-variant hover:text-primary transition-colors duration-200 p-2 rounded-full hover:bg-surface-variant/50 flex items-center justify-center">
                    <a href="https://www.linkedin.com/in/vishal-kumar-95b269390" target="_blank">KVK LinkedIN</a>
                </button>
            </div>
        </div>
        <!-- Main Content -->
        <main class="flex-grow flex flex-col w-full max-w-container-max mx-auto p-md md:p-lg gap-lg">
            <!-- Top Workspace (2 columns on desktop) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-lg h-full lg:h-[600px]">
                <!-- Left Column (Source Code) -->
                <div
                    class="lg:col-span-8 flex flex-col bg-surface-container rounded-lg border border-surface-variant inner-glow shadow-sm overflow-hidden flex-grow">
                    <!-- Editor Header -->
                    <div
                        class="flex justify-between items-center px-md py-sm border-b border-surface-variant bg-surface-container-high">
                        <div class="flex items-center gap-sm">
                            <span
                                class="material-symbols-outlined text-on-surface-variant text-sm">integration_instructions</span>
                            <span class="text-label-sm font-label-sm text-on-surface uppercase tracking-wider">Source
                                Code</span>
                        </div>
                        <div class="flex items-center gap-md">
                            <button onclick="clearText()"
                                class="text-on-surface-variant hover:text-error transition-colors flex items-center gap-xs">
                                <span class="material-symbols-outlined text-sm">delete</span>
                                <span class="text-label-sm font-label-sm">Clear</span>
                            </button>
                        </div>
                    </div>
                    <!-- Editor Body -->
                    <div class="flex flex-row flex-grow overflow-hidden relative">
                        <!-- Textarea -->
                        <textarea id="code_ip"
                            class="editor-textarea flex-grow w-full h-full p-sm text-code-block font-code-block custom-scrollbar"
                            placeholder="Paste your code here... We'll automatically detect the programming language."
                            spellcheck="false"></textarea>
                    </div>
                </div>
                <!-- Right Column (Conversion Settings) -->
                <div
                    class="lg:col-span-4 flex flex-col bg-surface-container rounded-lg border border-surface-variant inner-glow shadow-sm overflow-hidden h-full">
                    <!-- Settings Header -->
                    <div
                        class="flex items-center px-md py-sm border-b border-surface-variant bg-surface-container-high">
                        <span class="material-symbols-outlined text-on-surface-variant text-sm mr-sm">tune</span>
                        <span class="text-label-sm font-label-sm text-on-surface uppercase tracking-wider">Conversion
                            Settings</span>
                    </div>
                    <!-- Settings Body -->
                    <div class="p-md flex flex-col gap-md flex-grow overflow-y-auto custom-scrollbar">
                        <!-- Target Language -->
                        <div class="flex flex-col gap-xs">
                            <label class="text-label-sm font-label-sm text-on-surface-variant">Convert To</label>
                            <div class="relative">
                                <select id="target_language"
                                    class="w-full bg-surface-container-low border border-surface-variant rounded text-body-md font-body-md text-on-surface px-sm py-2 appearance-none focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors cursor-pointer">
                                    <option selected="" value="">Select target language</option>
                                    <option value="python">Python</option>
                                    <option value="javascript">JavaScript</option>
                                    <option value="typescript">TypeScript</option>
                                    <option value="java">Java</option>
                                    <option value="cpp">C++</option>
                                    <option value="c">C</option>
                                    <option value="go">Go</option>
                                    <option value="rust">Rust</option>
                                    <option value="sql">SQL</option>
                                    <option value="bash">Bash</option>
                                </select>
                                <span
                                    class="material-symbols-outlined absolute right-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                            </div>
                        </div>
                        <!-- Additional Instructions -->
                        <div class="flex flex-col gap-xs flex-grow">
                            <label class="text-label-sm font-label-sm text-on-surface-variant">Additional Instructions
                                <span class="text-outline-variant font-normal">(Optional)</span></label>
                            <textarea id="additional_ip"
                                class="w-full flex-grow min-h-[150px] bg-surface-container-low border border-surface-variant rounded text-body-md font-body-md text-on-surface p-sm focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors custom-scrollbar resize-none"
                                placeholder="Describe what you want to change... Example: Convert this code to JavaScript and make it asynchronous."></textarea>
                        </div>
                    </div>
                    <!-- Settings Footer (Action) -->
                    <div class="p-md border-t border-surface-variant bg-surface-container-lowest">
                        <button onclick="convertCode()"
                            class="w-full bg-primary hover:bg-primary-container text-surface-container-lowest font-label-sm text-label-sm py-3 px-4 rounded transition-all duration-200 flex items-center justify-center gap-sm inner-glow shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                            <span class="material-symbols-outlined text-xl">auto_awesome</span>
                            <span>Convert Code</span>
                        </button>
                        <div id="loading" style="display: none;">
                            <div class="spinner"></div>
                            <span>Converting...</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Output Section (Full Width) -->
            <div
                class="flex flex-col bg-surface-container rounded-lg border border-surface-variant inner-glow shadow-sm overflow-hidden h-[400px]">
                <!-- Output Header -->
                <div
                    class="flex justify-between items-center px-md py-sm border-b border-surface-variant bg-surface-container-high">
                    <div class="flex items-center gap-sm">
                        <span class="material-symbols-outlined text-secondary text-sm">terminal</span>
                        <span class="text-label-sm font-label-sm text-on-surface uppercase tracking-wider">Converted
                            Code</span>
                    </div>
                    <div class="flex items-center gap-sm">
                        <button
                            class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs px-2 py-1 rounded hover:bg-surface-variant/50">
                            <span class="material-symbols-outlined text-sm">content_copy</span>
                            <span class="text-label-sm font-label-sm">Copy Code</span>
                        </button>
                        <button
                            class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs px-2 py-1 rounded hover:bg-surface-variant/50">
                            <span class="material-symbols-outlined text-sm">download</span>
                            <span class="text-label-sm font-label-sm">Download</span>
                        </button>
                        <div class="w-px h-4 bg-surface-variant mx-1"></div>
                        <button
                            class="text-on-surface-variant hover:text-error transition-colors flex items-center gap-xs px-2 py-1 rounded hover:bg-surface-variant/50">
                            <span class="material-symbols-outlined text-sm">delete</span>
                            <span class="text-label-sm font-label-sm">Clear</span>
                        </button>
                    </div>
                </div>
                <!-- Output Body -->
                <div class="flex flex-row flex-grow overflow-hidden relative bg-[#0b1326]">
                    <!-- Line Numbers (Empty state) -->
                    <div
                        class="w-12 bg-surface-container-low border-r border-surface-variant flex flex-col items-end py-sm pr-2 text-outline-variant text-code-block font-code-block select-none overflow-hidden">
                        <div>1</div>
                    </div>
                    <!-- Display Area -->
                    <div
                        class="flex-grow w-full h-full p-sm text-code-block font-code-block custom-scrollbar overflow-auto text-outline-variant flex items-center justify-center">
                        <pre id="output_code" class="whitespace-pre font-mono w-full h-full text-white opacity-100">Your converted code will appear here...</pre>
                    </div>
                </div>
            </div>
        </main>
        <!-- Footer -->
        <footer class="bg-background dark:bg-background border-t border-outline-variant full-width mt-auto">
            <div class="flex flex-row justify-between items-center px-lg py-md w-full max-w-container-max mx-auto">
                <span class="text-label-sm font-label-sm font-bold text-on-surface">© 2026 CodeMorph AI</span>
                <div class="flex gap-md">
                    <a class="text-body-md font-body-md text-on-surface-variant hover:text-primary underline transition-all cursor-pointer"
                        href="https://kvk-profile-nu.vercel.app/" target="_blank">About Developer</a>
                    <a class="text-body-md font-body-md text-on-surface-variant hover:text-primary underline transition-all cursor-pointer"
                        href="https://github.com/kvkdev-ml" target="_blank">KVK Github</a>
                    <a class="text-body-md font-body-md text-on-surface-variant hover:text-primary underline transition-all cursor-pointer"
                        href="https://www.linkedin.com/in/vishal-kumar-95b269390" target="_blank">Linked IN-KVK</a>
                </div>
            </div>
        </footer>
</body>
<script>
    document.getElementById("code_ip").addEventListener("keydown", function (e) {
        if (e.key === "Tab") {
            e.preventDefault();

            const start = this.selectionStart;
            const end = this.selectionEnd;

            this.value =
                this.value.substring(0, start) +
                "    " +
                this.value.substring(end);

            this.selectionStart = this.selectionEnd = start + 4;
        }
    });
    async function convertCode() {
        console.clear()
        let text_ip = document.getElementById('code_ip').value.trim();
        let targetLanguage = document.getElementById('target_language').value;
        let additionalInput = document.getElementById('additional_ip').value.trim();
        if (text_ip === '') {
            alert('No Code is given!!!');
            return;
        }
        if (targetLanguage === '') {
            alert('Target Language is not selected!!');
            return;
        }
        let bodyContent = JSON.stringify({
            code_snippet: text_ip,
            target_language: targetLanguage,
            additional_ip: additionalInput
        });
        document.getElementById("loading").style.display = "flex";
        try {
            let response = await fetch("http://127.0.0.1:5000/api/morph_code", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: bodyContent
            });
            if (!response.ok) {
                throw new Error(`HTTP error: ${response.status}`);
            }
            let data = await response.json();
            console.log(data);
            if (data['response'] == 1) {
                if (data['valid_code'] == 'valid') {
                    document.getElementById('output_code').textContent=data['output_code'];
                }
                else {
                    alert('code is not valid')
                }
            }
            else {
                alert('Backend Issue.Contact Developer!!')
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Something went wrong while contacting the backend.");
        }

        // HIDE SPINNER
        document.getElementById("loading").style.display = "none";
    }
    function clearText() {
        document.getElementById('code_ip').value = '';
    }
</script>
</html>
